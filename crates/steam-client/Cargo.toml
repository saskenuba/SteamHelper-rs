[package]
name = "steam-client-lib"
version = "0.2.1"
authors = ["Martin <martin@hotmail.com.br>"]
edition = "2018"
license = "MIT"
repository = "https://github.com/saskenuba/SteamHelper-rs/tree/master/crates/steam-client"
description = "Steam client over the CM protocol: logon with tokens, events, service calls and the CS2 game coordinator."

# The package is steam-client-lib because crates.io's steam-client is someone else's; the crate stays steam_client
[lib]
name = "steam_client"

[features]
default = []

# Optional Websockets connection to Steam Servers
websockets = ["tokio-tungstenite"]

# Counter-Strike 2 over its game coordinator: inspect links (pattern, float, stickers), profiles, matches, inventory
cs2 = ["steam-protobuf/csgo"]

[dependencies]

anyhow = "^1.0"
base64.workspace = true
bytes = "^1.0"
crc32fast = "1"
lazy_static = "1"
log = "^0.4"
miniz_oxide = "0.9"
num-traits = "0.2"
rand.workspace = true
rsa = "0.9"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1"
sha1 = "0.10"
# already in the tree through tokio: TCP keepalive times, which tokio doesn't expose
socket2 = "0.6"
thiserror = "^1.0"

# futures
# 1.22: mpsc::WeakUnboundedSender
tokio = { version = "^1.22", features = ["io-util", "net", "rt", "macros", "sync", "time"] }
tokio-tungstenite = { version = "^0.13", optional = true }


# Internal Dependencies
[dependencies.steam-protobuf]
version = "^0.3.1"
path = "../steam-protobuf"
features = ["full"]

[dependencies.steam-cryptography]
version = "^0.1.0"
path = "../steam-cryptography"

[dependencies.steam-language-gen]
version = "^0.2"
path = "../steam-language-gen"

[dependencies.tappet]
version = "^0.8.0"
path = "../tappet"

[dependencies.steamid-parser]
version = "^1"
path = "../steamid-parser"

[dependencies.steam-totp]
version = "^0.2.3"
path = "../steam-totp"

[[example]]
name = "cs2_inspect"
required-features = ["cs2"]

[[example]]
name = "cs2_profile"
required-features = ["cs2"]

[dev-dependencies]
env_logger = { version = "0.9", features = ["termcolor"] }
flate2 = "1"
tokio = { version = "^1.22", features = ["rt-multi-thread", "test-util", "signal"] }
