[package]
name = "steam-client"
version = "0.1.0"
authors = ["Martin <martin@hotmail.com.br>"]
edition = "2018"
publish = false

[features]
default = []

# Optional Websockets connection to Steam Servers
websockets = ["tokio-tungstenite"]

[dependencies]

anyhow = "^1.0"
base64.workspace = true
bytes = "^1.0"
crc32fast = "1"
lazy_static = "1"
log = "^0.4"
miniz_oxide = "0.9"
num-traits = "0.2"
rand.workspace = true
rsa = "0.9"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1"
sha1 = "0.10"
# already in the tree through tokio: TCP keepalive times, which tokio doesn't expose
socket2 = "0.6"
thiserror = "^1.0"

# futures
tokio = { version = "^1.1", features = ["io-util", "net", "rt", "macros", "sync", "time"] }
tokio-tungstenite = { version = "^0.13", optional = true }


# Internal Dependencies
[dependencies.steam-protobuf]
path = "../steam-protobuf"
features = ["full"]

[dependencies.steam-crypto]
path = "../steam-crypto"

[dependencies.steam-language-gen]
path = "../steam-language-gen"

[dependencies.tappet]
path = "../tappet"

[dependencies.steamid-parser]
path = "../steamid-parser"

[dependencies.steam-totp]
path = "../steam-totp"

[dev-dependencies]
env_logger = { version = "*", features = ["termcolor"] }
flate2 = "1"
tokio = { version = "^1.1", features = ["rt-multi-thread", "test-util"] }
