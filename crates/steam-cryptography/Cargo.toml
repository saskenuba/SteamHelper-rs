[package]
name = "steam-cryptography"
version = "0.1.0"
authors = ["Martin <martin@hotmail.com.br>"]
edition = "2018"
license = "MIT"
repository = "https://github.com/saskenuba/SteamHelper-rs/tree/master/crates/steam-cryptography"
description = "Cryptography of the Steam CM protocol: the channel handshake and AES-256 packets with HMAC IVs."

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
crc32fast = "1"
hmac = "0.12"
rand.workspace = true
rsa = "0.9"
sha1 = { version = "0.10", features = ["oid"] }
thiserror = "^2"
