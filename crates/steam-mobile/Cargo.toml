[package]
name = "steam-mobile"
version = "0.7.0"
authors = ["Martin <martin@hotmail.com.br>"]
repository = "https://github.com/saskenuba/SteamHelper-rs/tree/master/crates/steam-mobile/"
homepage = "https://github.com/saskenuba/SteamHelper-rs/tree/master/crates/steam-mobile/"
readme = "README.md"
license = "MIT"
edition = "2018"
description = "Add, remove and edit Steam 2fa codes programmaticaly, with optional CLI to generate TOTP Codes, add SteamGuard, etc."

[features]
default = ["cli"]

# This feature is used only if we want a CLI.
cli = ["clap", "dialoguer", "anyhow", "tokio"]

# Logging in to the Steam websites through a Steam client logged on with steam-client-lib (its CM session), which
# also renews the session's access token before it expires: `SteamAuthenticator::login_with_client`.
cm = ["dep:steam-client-lib"]

[[bin]]
name = "steam-mobile"
path = "src/bin/main.rs"
required-features = ["cli"]

[dependencies]
backoff = { version = "0.4", features = ["tokio", "futures"] }
hex = "0.4"
rsa = "0.9"
scraper = "0.18"
serde_with = { version = "^3", features = [] }
thiserror = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

base64.workspace = true
bytes.workspace = true
const_format.workspace = true
derive_more.workspace = true
futures-timer.workspace = true
futures-util.workspace = true
futures.workspace = true
parking_lot.workspace = true
rand.workspace = true
reqwest.workspace = true

serde_urlencoded = "^0"
serde.workspace = true
serde_derive.workspace = true
serde_json.workspace = true
serde_repr.workspace = true
strum.workspace = true
strum_macros.workspace = true

anyhow = { version = "1", optional = true }
clap = { version = "4.5", features = ["derive", "env"], optional = true }
dialoguer = { version = "0.10", optional = true }
tokio = { version = "1.0.2", features = ["rt-multi-thread", "macros", "fs"], optional = true }

steam-protobuf = { workspace = true, features = ["enums", "steammessages_auth_steamclient"] }
steam-language.workspace = true

# Only the cookie type; the jar is our own (src/cookie_jar.rs). 0.17 is the version reqwest's cookie store already
# pulls in.
[dependencies.cookie]
version = "0.17"

[dependencies.steam-totp]
version = "^0.2.3"
path = "../steam-totp"

[dependencies.steamid-parser]
version = "^1"
path = "../steamid-parser"

[dependencies.steam-client-lib]
version = "^0.2.0"
path = "../steam-client"
optional = true

[dev-dependencies]
# `rt-multi-thread`, `time` and `signal`: the examples.
tokio = { version = "^1", features = ["rt", "rt-multi-thread", "macros", "time", "signal"] }
tracing-subscriber = { version = "^0.3", features = ["env-filter"] }

[[example]]
name = "web_session"
required-features = ["cm"]

[[example]]
name = "web_session_bot"
required-features = ["cm"]
