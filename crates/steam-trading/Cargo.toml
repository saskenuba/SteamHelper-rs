[package]
name = "steam-trading"
version = "0.8.0"
authors = ["Martin <martin@hotmail.com.br>"]
edition = "2018"
repository = "https://github.com/saskenuba/SteamHelper-rs/tree/master/crates/steam-trading/"
homepage = "https://github.com/saskenuba/SteamHelper-rs/tree/master/crates/steam-trading/"
readme = "README.md"
license = "MIT"
description = "Create, accept and deny trade offers without your mobile device."
keywords = ["steam", "tradeoffer", "trading"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
# Where the items of an accepted offer went, through CS2's game coordinator (steam-client-lib's `cs2`):
# `SteamTradeManager::accept_and_find_items` and `find_received_items`. The account's CS2 session and web session
# share one Steam client logon (steam-mobile's `cm`, `SteamAuthenticator::login_with_client`).
cs2 = ["dep:steam-client-lib", "steam-client-lib/cs2", "steam-mobile/cm"]

[dependencies]
const_format = "^0.2"
erased-serde = "^0.4"
lazy_static = "^1"
regex = "^1"
thiserror = "1"
tracing = "^0.1"

steam-client-lib = { path = "../steam-client", version = "^0.2.1", optional = true }

futures = "^0.3"
futures-timer = "^3"
# Same major as tappet's, which takes a `reqwest::Client` for its per-call `SteamAPI` (access token mode).
reqwest = { version = "^0.11", default-features = false }

serde.workspace = true
# `raw_value`: inventory parts read only when asked for, without allocating.
serde_json = { workspace = true, features = ["raw_value"] }
serde_with = { version = "^1.9", features = ["json"] }

steam-language.workspace = true
steam-mobile = { workspace = true, default-features = false }
steamid-parser.workspace = true
tappet.workspace = true

[dev-dependencies]
# What steam-mobile encodes request forms with.
serde_urlencoded = "0.7"
# The examples.
tokio = { version = "^1", features = ["rt-multi-thread", "macros", "time"] }
tracing-subscriber = { version = "^0.3", features = ["env-filter"] }
# The examples' Steam Guard codes from a shared secret (cs2_trade_items).
steam-totp = { path = "../steam-totp", version = "^0.2.3" }

[[example]]
name = "full_trade"
required-features = ["cs2"]

[[example]]
name = "cs2_trade_items"
required-features = ["cs2"]
