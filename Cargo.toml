[workspace]
members = ["crates/*"]
resolver = "2"

# local crates
[workspace.dependencies]
steam-language = { path = "./crates/steam-language", version = "1.0.0" }
steam-mobile = { path = "./crates/steam-mobile", version = "^0.6.0", default-features = false }
steam-protobuf = { path = "./crates/steam-protobuf", version = "^0.3.0" }
steamid-parser = { path = "./crates/steamid-parser", version = "1.0.0" }
tappet = { path = "./crates/tappet", version = "0.6.0" }

base64 = "^0.21"
bytes = "^1"
const_format = "^0.2"
derive_more = { version = "1.0.0-beta.6", features = ["full"] }
rand = "^0.8"
reqwest = { version = "^0.11", features = ["cookies", "multipart"] }
futures = "^0.3"
futures-util = "^0.3"
futures-timer = "^3"
parking_lot = "^0.12"
strum = "0.25"
strum_macros = "0.25"

serde = { version = "1", features = ["rc"] }
serde_derive = "1"
serde_json = "1"
serde_repr = "^0"
